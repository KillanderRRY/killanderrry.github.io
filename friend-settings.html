<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Настройки — Максим</title>
<meta name="description" content="Настройки страницы Максима (Monolith / no_Jason).">
<style>
  :root{
    --bg:#0a0a0c;--bg-2:#0f0f13;--card:#15151b;--card-2:#1b1b23;
    --red:#3b82f6;--red-2:#60a5fa;--text:#f2f2f2;--muted:#9a9aa6;--border:#26262f;
    --radius:16px;--a:59,130,246;--a2:96,165,250;--nav-rgb:10,10,12;
  }
  /* Тема: синяя */
  html[data-theme="blue"]{
    --bg:#070b14;--bg-2:#0c1120;--card:#111831;--card-2:#171f3d;
    --text:#eef2ff;--muted:#9aa7d8;--border:#26335e;--nav-rgb:7,11,20;
  }
  /* Акценты: синий (по умолчанию), красный, серый */
  html[data-accent="red"]{--red:#e11d2e;--red-2:#ff2e3f;--a:225,29,46;--a2:255,46,63;}
  html[data-accent="blue"]{--red:#3b82f6;--red-2:#60a5fa;--a:59,130,246;--a2:96,165,250;}
  html[data-accent="gray"]{--red:#a6acb8;--red-2:#c6cbd4;--a:166,172,184;--a2:198,203,212;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .container{width:min(1080px,92%);margin:0 auto}
  header{position:sticky;top:0;z-index:50;background:var(--card-2);border-bottom:1px solid var(--border)}
  nav{display:flex;align-items:center;justify-content:space-between;height:64px}
  .f-back{text-decoration:none;color:var(--red-2);font-size:1.4rem;font-weight:800;line-height:1;transition:transform .2s}
  .f-back:hover{transform:translateX(-3px)}
  .f-logo{font-weight:900;letter-spacing:1px;font-size:1.05rem}
  .nav-links{display:flex;gap:20px;list-style:none}
  .nav-links a{text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;transition:color .2s}
  .nav-links a:hover{color:var(--text)}
  .nav-links a.active{color:var(--red-2)}
  main{padding:60px 0 100px;text-align:center}

  .settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;max-width:820px;margin:0 auto}
  .setting-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:left}
  .setting-card h2{font-size:1.2rem;font-weight:800;margin-bottom:4px}
  .setting-card .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .options{display:flex;gap:10px;flex-wrap:wrap}
  .opt{flex:1;min-width:110px;border:1.5px solid var(--border);border-radius:12px;padding:12px;background:var(--card-2);cursor:pointer;text-align:center;font-weight:700;font-size:.88rem;color:var(--muted);transition:.2s;font-family:inherit}
  .opt:hover{border-color:var(--red);color:var(--text)}
  .opt.active{border-color:var(--red);color:var(--text);box-shadow:0 0 0 1px var(--red),0 8px 20px rgba(var(--a),.25)}
  .opt i{display:block;width:100%;height:30px;border-radius:8px;margin-bottom:8px;border:1px solid var(--border)}
  .swatches{display:flex;gap:12px;flex-wrap:wrap}
  .swatch{width:46px;height:46px;border-radius:50%;cursor:pointer;position:relative;transition:transform .2s;border:3px solid transparent}
  .swatch:hover{transform:scale(1.1)}
  .swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--red),0 0 20px rgba(var(--a),.6)}
  .swatch.red{background:linear-gradient(135deg,#e11d2e,#ff2e3f)}
  .swatch.blue{background:linear-gradient(135deg,#3b82f6,#60a5fa)}
  .swatch.gray{background:linear-gradient(135deg,#a6acb8,#c6cbd4)}
  .swatch-name{text-align:center;margin-top:6px;font-size:.72rem;color:var(--muted)}
  .reset-btn{margin-top:32px;background:transparent;border:1.5px solid var(--border);color:var(--muted);font-weight:700;padding:12px 22px;border-radius:12px;cursor:pointer;transition:.2s;font-family:inherit}
  .reset-btn:hover{border-color:var(--red);color:var(--text)}
  @media (max-width:560px){ .nav-links{gap:12px;font-size:.8rem} }
</style>
</head>
<body>
<script>
  (function () {
    try {
      var th = localStorage.getItem('mf-theme') || 'dark';
      var ac = localStorage.getItem('mf-accent') || 'red';
      var root = document.documentElement;
      root.setAttribute('data-theme', th);
      root.setAttribute('data-accent', ac);
    } catch (e) {}
  })();
</script>

<header>
  <div class="container">
    <nav>
      <a href="index.html" class="f-back" aria-label="На главную KillanderRRY">←</a>
      <span class="f-logo">Monolith</span>
      <ul class="nav-links">
        <li><a href="friend.html">Обо мне</a></li>
        <li><a href="friend-gallery.html">Галерея</a></li>
        <li><a href="friend-settings.html" class="active">Настройки</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <div class="container">
    <div style="text-align:center"><h1>Настройки</h1><div class="sub">Выбери оформление страницы Максима.</div></div>

    <div class="settings-grid">
      <div class="setting-card">
        <h2>Тема</h2>
        <div class="sub">Цвет фона страницы</div>
        <div class="options" role="radiogroup" aria-label="Тема">
          <button class="opt" data-theme-val="dark" data-kind="theme"><i style="background:linear-gradient(135deg,#0a0a0c,#23232c)"></i>Чёрная</button>
          <button class="opt" data-theme-val="blue" data-kind="theme"><i style="background:linear-gradient(135deg,#070b14,#171f3d)"></i>Синяя</button>
        </div>
      </div>

      <div class="setting-card">
        <h2>Второй цвет</h2>
        <div class="sub">Акцент оформления</div>
        <div class="swatches" role="radiogroup" aria-label="Акцентный цвет">
          <div><button class="swatch blue" data-accent-val="blue" data-kind="accent" aria-label="Синий"></button><div class="swatch-name">Синий</div></div>
          <div><button class="swatch red" data-accent-val="red" data-kind="accent" aria-label="Красный"></button><div class="swatch-name">Красный</div></div>
          <div><button class="swatch gray" data-accent-val="gray" data-kind="accent" aria-label="Серый"></button><div class="swatch-name">Серый</div></div>
        </div>
      </div>
    </div>

    <div style="text-align:center">
      <button class="reset-btn" id="resetBtn">Сбросить настройки</button>
    </div>
  </div>
</main>

<script>
  const root = document.documentElement;
  let theme = localStorage.getItem('mf-theme') || 'dark';
  let accent = localStorage.getItem('mf-accent') || 'blue';
  function apply(){ root.setAttribute('data-theme', theme); root.setAttribute('data-accent', accent); }
  function mark(){
    document.querySelectorAll('[data-kind="theme"]').forEach((b) => b.classList.toggle('active', b.dataset.themeVal === theme));
    document.querySelectorAll('[data-kind="accent"]').forEach((b) => b.classList.toggle('active', b.dataset.accentVal === accent));
  }
  document.querySelectorAll('[data-kind="theme"]').forEach((b) => {
    b.addEventListener('click', () => { theme = b.dataset.themeVal; try{ localStorage.setItem('mf-theme', theme); }catch(e){} apply(); mark(); });
  });
  document.querySelectorAll('[data-kind="accent"]').forEach((b) => {
    b.addEventListener('click', () => { accent = b.dataset.accentVal; try{ localStorage.setItem('mf-accent', accent); }catch(e){} apply(); mark(); });
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    try{ localStorage.removeItem('mf-theme'); localStorage.removeItem('mf-accent'); }catch(e){}
    theme = 'dark'; accent = 'blue'; apply(); mark();
  });
  mark();
</script>
<script src="site-vfx.js"></script>
</body>
</html>
