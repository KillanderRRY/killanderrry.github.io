<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Галерея — Максим</title>
<meta name="description" content="Галерея Максима (Monolith / no_Jason).">
<style>
  :root{
    --bg:#0a0a0c;--bg-2:#0f0f13;--card:#15151b;--card-2:#1b1b23;
    --red:#e11d2e;--red-2:#ff2e3f;--text:#f2f2f2;--muted:#9a9aa6;--border:#26262f;
    --radius:16px;--a:225,29,46;--a2:255,46,63;--nav-rgb:10,10,12;
  }
  html[data-theme="light"]{--bg:#f4f4f6;--bg-2:#eaeaee;--card:#ffffff;--card-2:#f2f2f5;--text:#18181c;--muted:#5c5c68;--border:#d6d6de;--nav-rgb:244,244,246;}
  html[data-theme="red"]{--bg:#110507;--bg-2:#1a0909;--card:#241010;--card-2:#2b1414;--red:#ff3b45;--red-2:#ff5f6b;--text:#fff1f3;--muted:#c9a6aa;--border:#4a2127;--nav-rgb:17,5,7;--a:255,59,69;--a2:255,95,107;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .container{width:min(1080px,92%);margin:0 auto}
  header{position:sticky;top:0;z-index:50;background:var(--card-2);border-bottom:1px solid var(--border)}
  nav{display:flex;align-items:center;justify-content:space-between;height:64px}
  .f-back{text-decoration:none;color:var(--red-2);font-size:1.4rem;font-weight:800;line-height:1;transition:transform .2s}
  .f-back:hover{transform:translateX(-3px)}
  .f-logo{font-weight:900;letter-spacing:1px;font-size:1.05rem}
  .nav-links{display:flex;gap:20px;list-style:none}
  .nav-links a{text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;transition:color .2s}
  .nav-links a:hover{color:var(--text)}
  .nav-links a.active{color:var(--red-2)}
  main{padding:60px 0 100px;text-align:center}
  h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:900;margin-bottom:8px}
  .sub{color:var(--muted);margin-bottom:40px}
  .placeholder{max-width:640px;margin:0 auto;padding:40px;border:1.5px dashed var(--border);border-radius:16px;color:var(--muted)}
  @media (max-width:560px){ .nav-links{gap:12px;font-size:.8rem} }
</style>
</head>
<body>
<script>
  (function () {
    try {
      var th = localStorage.getItem('mf-theme') || localStorage.getItem('kr-theme') || 'dark';
      var ac = localStorage.getItem('mf-accent') || localStorage.getItem('kr-accent') || 'red';
      var root = document.documentElement;
      root.setAttribute('data-theme', th);
      root.setAttribute('data-accent', ac);
    } catch (e) {}
  })();
</script>

<header>
  <div class="container">
    <nav>
      <a href="index.html" class="f-back" aria-label="На главную KillanderRRY">←</a>
      <span class="f-logo">Monolith</span>
      <ul class="nav-links">
        <li><a href="friend.html">Обо мне</a></li>
        <li><a href="friend-gallery.html" class="active">Галерея</a></li>
        <li><a href="friend-settings.html">Настройки</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <div class="container">
    <h1>Галерея</h1>
    <div class="sub">Скоро здесь появятся любимые моменты Максима.</div>
    <div class="placeholder">Фото и скриншоты добавятся позже.</div>
  </div>
</main>
<script src="site-vfx.js"></script>
</body>
</html>
