<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Секретное — Максим</title>
<meta name="description" content="Секретный раздел страницы Максима.">
<style>
  :root{
    --bg:#0a0a0c;--bg-2:#0f0f13;--card:#15151b;--card-2:#1b1b23;
    --red:#3b82f6;--red-2:#60a5fa;--text:#f2f2f2;--muted:#9a9aa6;--border:#26262f;
    --radius:16px;--a:59,130,246;--a2:96,165,250;--nav-rgb:10,10,12;
  }
  html[data-theme="blue"]{--bg:#070b14;--bg-2:#0c1120;--card:#111831;--card-2:#171f3d;--text:#eef2ff;--muted:#9aa7d8;--border:#26335e;--nav-rgb:7,11,20;}
  html[data-accent="red"]{--red:#e11d2e;--red-2:#ff2e3f;--a:225,29,46;--a2:255,46,63;}
  html[data-accent="gray"]{--red:#a6acb8;--red-2:#c6cbd4;--a:166,172,184;--a2:198,203,212;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .container{width:min(760px,92%);margin:0 auto}
  header{position:sticky;top:0;z-index:50;background:var(--card-2);border-bottom:1px solid var(--border)}
  nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:14px}
  .f-left{display:flex;align-items:center;gap:12px}
  .f-back{text-decoration:none;color:var(--red-2);font-size:1.4rem;font-weight:800;line-height:1;transition:transform .2s}
  .f-back:hover{transform:translateX(-3px)}
  .f-logo{font-weight:900;letter-spacing:1px;font-size:1.05rem}
  .nav-links{display:flex;gap:20px;list-style:none}
  .nav-links a{text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;transition:color .2s}
  .nav-links a:hover{color:var(--text)}
  .nav-links a.active{color:var(--red-2)}
  main{padding:60px 0 100px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:30px;text-align:center}
  .tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
  h1{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:900;margin-bottom:10px}
  .meme{color:var(--muted);font-size:.95rem;margin-bottom:20px;font-style:italic}
  .placeholder{border:1.5px dashed var(--border);border-radius:12px;padding:24px;color:var(--muted)}
  @media (max-width:560px){ .nav-links{gap:12px;font-size:.8rem} }
</style>
</head>
<body>
<script>
  (function () {
    try {
      var th = localStorage.getItem('mf-theme') || 'dark';
      var ac = localStorage.getItem('mf-accent') || 'blue';
      var root = document.documentElement;
      root.setAttribute('data-theme', th);
      root.setAttribute('data-accent', ac);
    } catch (e) {}
  })();
</script>

<header>
  <div class="container">
    <nav>
      <div class="f-left">
        <a href="friend.html" class="f-back" aria-label="Обо мне">←</a>
        <span class="f-logo">Monolith</span>
      </div>
      <ul class="nav-links">
        <li><a href="friend.html">Обо мне</a></li>
        <li><a href="friend-gallery.html">Галерея</a></li>
        <li><a href="friend-settings.html">Настройки</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <div class="container">
    <div class="card">
      <div class="tag">Секретный раздел</div>
      <h1>Если ты это видишь — ты нашёл мем</h1>
      <div class="meme">Контент для своих, внутри. Добавится, когда Максим подкинет приколы.</div>
      <div class="placeholder">Мемы и внутренние шутки появятся здесь позже 👀</div>
    </div>
  </div>
</main>
<script src="site-vfx.js"></script>
</body>
</html>
