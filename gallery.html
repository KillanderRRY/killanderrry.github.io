<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Галерея — KillanderRRY</title>
<meta name="description" content="Галерея скриншотов и артов KillanderRRY. Скоро добавлю кадры из моих модов.">
<style>
  :root{
    --bg:#0a0a0c;--bg-2:#0f0f13;--card:#15151b;--card-2:#1b1b23;
    --red:#e11d2e;--red-2:#ff2e3f;--text:#f2f2f2;--muted:#9a9aa6;--border:#26262f;
    --radius:16px;--shadow:0 20px 50px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit}
  a:focus-visible,button:focus-visible{outline:2px solid var(--red-2);outline-offset:3px;border-radius:4px}
  ::selection{background:rgba(225,29,46,.55);color:#fff}
  .container{width:min(1080px,92%);margin:0 auto}

  header{position:sticky;top:0;z-index:50;background:rgba(10,10,12,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
  nav{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{font-weight:800;letter-spacing:.5px;text-decoration:none}
  .logo span{color:var(--red)}
  .nav-links{display:flex;gap:20px;list-style:none}
  .nav-links a{text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;transition:color .2s}
  .nav-links a:hover{color:var(--text)}
  .nav-links a.active{color:var(--red-2)}

  .page-hero{padding:70px 0 36px;text-align:center}
  .eyebrow{display:inline-block;font-size:.76rem;font-weight:700;letter-spacing:2px;color:var(--red-2);text-transform:uppercase;margin-bottom:14px}
  .page-hero h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:900;letter-spacing:-1px}
  .page-hero p{color:var(--muted);max-width:52ch;margin:16px auto 0}

  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;padding-bottom:90px}
  .g-item{
    position:relative;aspect-ratio:16/10;border-radius:var(--radius);overflow:hidden;
    border:1px solid var(--border);cursor:zoom-in;transition:transform .22s,border-color .22s,box-shadow .22s;
    background:linear-gradient(150deg,#14141a,#1a0a0e 60%);
  }
  .g-item:hover{transform:translateY(-5px) scale(1.01);border-color:var(--red);box-shadow:0 22px 50px rgba(225,29,46,.18)}
  .g-art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#3a3a45;font-style:italic;font-size:.9rem}
  .g-cap{
    position:absolute;left:0;right:0;bottom:0;padding:26px 16px 14px;
    background:linear-gradient(transparent,rgba(0,0,0,.8));
    font-size:.88rem;font-weight:600;opacity:0;transition:opacity .25s;
  }
  .g-item:hover .g-cap{opacity:1}

  .lightbox{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.88);z-index:100;padding:24px;
    animation:fadeIn .2s ease;
  }
  .lightbox.open{display:flex}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .lb-box{position:relative;max-width:min(900px,100%);width:100%}
  .lb-art{aspect-ratio:16/9;border-radius:var(--radius);background:linear-gradient(150deg,#1a1a22,#2a0e12 60%);display:flex;align-items:center;justify-content:center;color:#3a3a45;font-style:italic;border:1px solid var(--border)}
  .lb-cap{margin-top:14px;color:var(--muted);text-align:center;font-weight:600}
  .lb-close{
    position:absolute;top:-44px;right:0;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer;line-height:1;
  }
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.06);border:1px solid var(--border);color:#fff;width:48px;height:48px;border-radius:50%;cursor:pointer;font-size:1.4rem;transition:background .2s}
  .lb-nav:hover{background:var(--red)}
  .lb-prev{left:-62px}
  .lb-next{right:-62px}
  @media (max-width:640px){.lb-prev{left:-6px}.lb-next{right:-6px}.lb-nav{width:40px;height:40px;font-size:1.1rem}.lb-close{top:-40px}}

  @media (max-width:560px){.nav-links{gap:12px;font-size:.8rem}}
</style>
</head>
<body>

<header>
  <div class="container">
    <nav>
      <a href="index.html" class="logo">Killander<span>RRY</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Главная</a></li>
        <li><a href="mods.html">Моды</a></li>
        <li><a href="gallery.html" class="active">Галерея</a></li>
        <li><a href="download.html">Скачать</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Скриншоты и арты</span>
      <h1>Галерея</h1>
      <p>Кадры из моих модов и настроение моего мира. Скоро добавлю настоящие скриншоты — кликни по карточке, чтобы увеличить.</p>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="gallery" id="gallery">
        <div class="g-item" data-title="Скриншот мода — скоро">
          <div class="g-art">изображение скоро</div>
          <div class="g-cap">Скриншот из мода</div>
        </div>
        <div class="g-item" data-title="Арт — скоро">
          <div class="g-art">арт скоро</div>
          <div class="g-cap">Фанарт</div>
        </div>
        <div class="g-item" data-title="Кадр — скоро">
          <div class="g-art">кадр скоро</div>
          <div class="g-cap">Кадр из игры</div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="lightbox" id="lightbox">
  <div class="lb-box">
    <button class="lb-close" id="lb-close" aria-label="Закрыть">×</button>
    <div class="lb-art" id="lb-art">изображение скоро</div>
    <div class="lb-cap" id="lb-cap"></div>
    <button class="lb-nav lb-prev" id="lb-prev" aria-label="Назад">‹</button>
    <button class="lb-nav lb-next" id="lb-next" aria-label="Вперёд">›</button>
  </div>
</div>

<script>
  const items = Array.from(document.querySelectorAll('.g-item'));
  const lb = document.getElementById('lightbox');
  const lbCap = document.getElementById('lb-cap');
  let cur = 0;
  function open(i) {
    cur = (i + items.length) % items.length;
    lbCap.textContent = items[cur].dataset.title;
    lb.classList.add('open');
  }
  items.forEach((it, i) => it.addEventListener('click', () => open(i)));
  document.getElementById('lb-close').addEventListener('click', () => lb.classList.remove('open'));
  document.getElementById('lb-prev').addEventListener('click', () => open(cur - 1));
  document.getElementById('lb-next').addEventListener('click', () => open(cur + 1));
  lb.addEventListener('click', (e) => { if (e.target === lb) lb.classList.remove('open'); });
  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') lb.classList.remove('open');
    if (e.key === 'ArrowLeft') open(cur - 1);
    if (e.key === 'ArrowRight') open(cur + 1);
  });
</script>
</body>
</html>
